    <meta name="theme-color" content="#6B1724" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <title>Shivaayaha Silk Sarees | Manual Ledger & Paid & Due Ledger</title>
    <!-- GitHub Pages SPA: restore the real URL from the ?p= param set by 404.html -->
    <script>
      (function() {
        var redirect = window.location.search.slice(1);
        if (redirect && redirect.startsWith('p=')) {
          var decoded = decodeURIComponent(redirect.slice(2).replace(/&q=/, '?'));
          window.history.replaceState(null, null, '/' + decoded);
        }
      })();
    </script>
  </head>
  <body class="bg-stone-100 text-stone-900 antialiased selection:bg-silk-maroon-700 selection:text-silk-gold-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service Worker: Unregister any stale SW first, then register the fresh one
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            // Unregister all existing service workers to clear any stale cache
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const reg of registrations) {
              // Only unregister workers from a different scope or with old cache version
              if (reg.scope !== window.location.origin + '/') {
                await reg.unregister();
              }
            }
            // Register the fresh service worker
            const registration = await navigator.serviceWorker.register('./sw.js');
            console.log('PWA ServiceWorker registered:', registration.scope);
          } catch (err) {
            console.log('PWA ServiceWorker registration failed:', err);
          }
        });
      }
    </script>
  </body>
</html>
